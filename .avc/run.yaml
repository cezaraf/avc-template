    - "install.sh"
    - "LICENSE"
    - "START-HERE.md"
    - "PLATFORM-ADAPTERS.md"
    - "AGILE-VIBE-CODING-OS.md"
  deny:
    - ".git/**"
    - "infra/**"
  acceptance_paths:
    - ".avc/tests/**"

commands:
  baseline: ["python3", ".avc/bin/avc.py", "doctor", "--offline"]
  fast: ["python3", "-m", "unittest", "discover", "-s", ".avc/tests", "-p", "test_*.py"]
  affected: ["python3", ".avc/bin/avc.py", "doctor"]
  acceptance: ["python3", ".avc/bin/avc.py", "doctor", "--strict"]
  full: ["./.avc/scripts/ci.sh"]
  live_qa: ["./.avc/scripts/qa-ai-memory.sh"]

oracle:
  status: frozen
  owner: verifier
  frozen_at_revision: 5
  acceptance_ids: [ACC-001, ACC-002, ACC-003, ACC-004, ACC-005, ACC-006]
  witness: executable
  commands:
    - ["python3", "-m", "unittest", "discover", "-s", ".avc/tests", "-p", "test_*.py"]
    - ["./.avc/scripts/qa-ai-memory.sh"]
    - ["gh", "repo", "view", "cezaraf/avc-template", "--json", "visibility,isTemplate,url,defaultBranchRef"]

