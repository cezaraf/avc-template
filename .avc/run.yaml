version: avc.dev/v1alpha1
run_id: AVC-BOOTSTRAP-0001
revision: 6
head: UNBORN

story:
  outcome: Any maintainer can install the AVC/XP kernel with ai-memory into a Git repository through a harness-agnostic installer and obtain the public GitHub template cezaraf/avc-template.
  value: Make the operating model safely reusable from Codex, Claude Code, OpenCode, or a generic AGENTS/Agent-Skills-compatible harness.
  non_goals:
    - Enable cloud LLM or embedding providers for ai-memory.
    - Guess or overwrite product-specific build, test, deployment, or acceptance commands.
    - Provide a native Windows installer in this slice; Bash on Linux/macOS/WSL is the supported installation surface.
  lane: guarded
  lane_reasons:
    - The installer writes governance files into another repository and may enable harness-specific adapters.
    - Commit, push, public repository creation, and GitHub template configuration are external effects.
    - Lifecycle hooks and a required local MCP change supported agent runtimes.
  examples:
    - id: ACC-001
      given: The repository bootstrap files are present
      when: The maintainer runs the focused AVC checks
      then: Configuration, rules, hooks, roles, skills, and schemas validate
    - id: ACC-002
      given: Docker is available and the ai-memory bootstrap has run
      when: The maintainer runs live memory QA
      then: ai-memory reports healthy for the pinned project scope
    - id: ACC-003
      given: A Git repository with pre-existing AGENTS.md content
      when: The maintainer installs the generic adapter twice
      then: The AVC kernel is valid and the original instructions are preserved without duplicate managed blocks
    - id: ACC-004
      given: A clean Git repository
      when: The maintainer requests the Codex adapter
      then: Portable kernel files and the project-local Codex adapter are installed with a project-specific ai-memory marker
    - id: ACC-005
      given: Any target directory
      when: The maintainer runs install.sh with --dry-run
      then: The planned writes are reported and the target remains unchanged
    - id: ACC-006
      given: The publication is complete
      when: A consumer opens github.com/cezaraf/avc-template on main
      then: The repository is public, marked as a GitHub template, and exposes README.md and executable install.sh
  definition_of_done:
    - ACC-001 through ACC-005 pass on the exact current HEAD
    - ACC-006 passes against the public GitHub repository
    - An independent verifier reports no blocking finding
    - The human accepts the outcome

scope:
  allow:
    - ".avc/**"
    - ".agents/skills/**"
    - ".codex/**"
    - ".ai-memory.toml"
    - ".gitignore"
    - "AGENTS.md"
