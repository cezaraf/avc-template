# Portable expanded example retained from the design package. The active state
# is .avc/run.yaml and the compact copy template is .avc/run.example.yaml.
version: avc.dev/v1alpha1
run_id: AVC-0001
revision: 1
head: replace-with-current-head

story:
  outcome: A user can observe the requested behavior
  value: Explain why this matters
  non_goals:
    - Explicitly excluded outcome
  lane: flow
  lane_reasons:
    - Small, reversible, isolated, known harness
  examples:
    - id: ACC-001
      given: Initial observable context
      when: User action
      then: Observable result
  definition_of_done:
    - ACC-001 passes on the current HEAD

scope:
  allow:
    - src/feature/**
    - tests/feature/**
  deny:
    - infra/**
    - migrations/**
  acceptance_paths:
    - tests/acceptance/AVC-0001/**

commands:
  baseline: ["replace-me"]
  fast: ["replace-me"]
  affected: ["replace-me"]
  acceptance: ["replace-me"]
  full: ["replace-me"]
  live_qa: []

oracle:
  status: draft
  owner: verifier
  frozen_at_revision: null
  acceptance_ids: [ACC-001]
  witness: executable

authority:
  scope_expansion: human
  lane_reduction: human
  oracle_change_after_freeze: human
  new_dependency: human
  migration: human
  commit: human
  push: human
  merge: human
  deploy: human

state:
  phase: candidate
  micro_phase: observe
  active_node: null
  blocked_by: []
  repair_cycles: 0

graph:
  - id: N1
    kind: scout
    intent: Establish baseline and minimal surface
    owner: scout
    depends_on: []
    authorized_paths: []
    status: runnable
    created_from: story
    attempt: 0
    evidence: null
    stop_condition: Baseline and relevant paths are factual

discoveries: []
amendments: []
evidence: {}
